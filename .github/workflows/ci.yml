name: CI

# Eight gates, and every one of them is a requirement from the cahier des charges rather
# than a habit: a green build here is the evidence §14.1 asks for, not a feeling.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Gate 1 — the machine-readable spec still matches the Committee's workbook.
      # A requirement that exists in one and not the other is how traceability dies.
      - name: Spec is in step with the workbook
        run: |
          python3 tools/gen_spec.py
          git diff --exit-code spec/ || {
            echo "::error::spec/*.json is stale — run tools/gen_spec.py and commit"
            exit 1
          }

      # Gates 2 to 4 run over every package, so adding a module cannot quietly opt out
      # of analysis, formatting or tests.
      - name: Analyse, format and test every package
        run: |
          set -e
          for package in packages/*/; do
            echo "::group::$package"
            ( cd "$package"
              dart pub get
              # Warnings are failures. The localisation coverage gate (NFR-I18N-01) and the
              # error-catalogue completeness gate (FR-M1-10) run inside the test suite: a
              # missing FR or EN string fails the build rather than reaching a child.
              dart analyze --fatal-infos --fatal-warnings
              dart format --output=none --set-exit-if-changed .
              dart test --reporter=expanded )
            echo "::endgroup::"
          done

      # Gate 5 — every requirement marked done is named by a test, M1 imports no platform
      # library, and no code references a requirement nobody agreed.
      - name: Requirement traceability
        run: dart tools/trace_check.dart

      - name: Publish the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence
          path: |
            build/traceability.md
            packages/kodo_lang/build/m1_performance.json
          if-no-files-found: warn
