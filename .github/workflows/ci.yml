name: CI

# Eight gates, and every one of them is a requirement from the cahier des charges rather
# than a habit: a green build here is the evidence §14.1 asks for, not a feeling.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # kodo_app is the only package that needs Flutter; the rest are pure Dart on
      # purpose, so that the language core, the grader and the mastery rule can be run and
      # reasoned about without a UI toolkit in the way.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Gate 1 — the machine-readable spec still matches the Committee's workbook.
      # A requirement that exists in one and not the other is how traceability dies.
      - name: Spec is in step with the workbook
        run: |
          python3 tools/gen_spec.py
          git diff --exit-code spec/ || {
            echo "::error::spec/*.json is stale — run tools/gen_spec.py and commit"
            exit 1
          }

      # Gates 2 to 4 run over every package, so adding a module cannot quietly opt out
      # of analysis, formatting or tests.
      - name: Analyse, format and test every package
        run: |
          set -e
          for package in packages/*/; do
            echo "::group::$package"
            ( cd "$package"
              if grep -q '^  flutter:' pubspec.yaml; then
                flutter pub get
                # Warnings are failures. The localisation coverage gate (NFR-I18N-01) and
                # the error-catalogue completeness gate (FR-M1-10) run inside the test
                # suites: a missing FR or EN string fails the build rather than reaching a
                # child.
                flutter analyze --fatal-infos --fatal-warnings
                dart format --output=none --set-exit-if-changed .
                flutter test --reporter=expanded
              else
                dart pub get
                dart analyze --fatal-infos --fatal-warnings
                dart format --output=none --set-exit-if-changed .
                dart test --reporter=expanded
              fi )
            echo "::endgroup::"
          done

      # Gate 4b — the application itself. M19 is where the eleven packages become
      # something a child can open, so it is built as well as tested: a shell that passes
      # its widget tests and does not compile is not a shell.
      - name: Build and test the application (M19)
        working-directory: app
        run: |
          sh tool/bundle_content.sh
          flutter pub get
          flutter analyze --fatal-infos --fatal-warnings
          dart format --output=none --set-exit-if-changed .
          flutter test --reporter=expanded
          flutter build web --release --no-web-resources-cdn

      # Gate 5 — content. The authoring tool re-publishes every world through M6's publish
      # gate and M5's content gate, then the repository is diffed. A bank that ships and a
      # bank that was checked have to be the same bank, and a world over its size budget
      # fails the build (FR-M14-02).
      - name: Re-author and verify the content packs
        working-directory: packages/kodo_content
        run: |
          dart run tool/author_world0.dart
          dart run tool/author_world1.dart
          dart run tool/author_world2.dart
      - name: Content is in step with its source
        run: |
          git diff --exit-code content/ || {
            echo "::error::content/*.json is stale — re-run the authoring tool and commit"
            exit 1
          }

      # Gate 6 — every requirement marked done is named by a test, M1 imports no platform
      # library, and no code references a requirement nobody agreed.
      - name: Requirement traceability
        run: dart tools/trace_check.dart

      - name: Publish the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence
          path: |
            build/traceability.md
            packages/kodo_lang/build/m1_performance.json
          if-no-files-found: warn
