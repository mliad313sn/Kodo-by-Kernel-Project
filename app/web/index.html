<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KODO teaches children aged 8 to 11 to program, in French and in English, with no network connection and no account.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KODO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KODO</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- KODO offline.
       Flutter stopped shipping a caching service worker; the one in the build is 784
       bytes long and unregisters itself. This application cannot live with that: a child
       in a classroom with one hour of connectivity a week has to be able to open KODO on
       Thursday. So the worker is ours, it is generated from the build by
       tool/make_service_worker.dart, and it is registered here rather than through the
       Flutter loader, which no longer offers to.

       Registered after load so it never competes with the first paint for bandwidth: the
       first visit is a normal visit, and it is the second one that has to work with the
       network off. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('kodo_sw.js').catch(function (e) {
          // A browser that refuses is a browser that stays online-only. It is not a
          // reason to fail the page.
          console.warn('kodo: offline support unavailable', e);
        });
      });
    }
  </script>
</body>
</html>
